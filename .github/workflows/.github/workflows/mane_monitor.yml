name: MANE EDGAR Monitor

on:
  schedule:
    # Runs Monday through Friday every 30 minutes between 10:00 and 22:00 UTC
    - cron: '*/30 10-22 * * 1-5'
  workflow_dispatch:

jobs:
  check-sec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run SEC Monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor_mane.py
